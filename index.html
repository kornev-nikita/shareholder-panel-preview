body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--canvas);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

<script>
(() => {
'use strict';
const form = document.getElementById('unlock');
const field = document.getElementById('password');
const button = document.getElementById('submit');
const status = document.getElementById('status');
const toggle = document.getElementById('toggle');
const decode = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));

toggle.addEventListener('click', () => {
  const visible = field.type === 'password';
  field.type = visible ? 'text' : 'password';
  toggle.textContent = visible ? 'Скрыть' : 'Показать';
  toggle.setAttribute('aria-pressed', String(visible));
  field.focus();
});
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (button.disabled || !field.value) return;
  if (!globalThis.crypto?.subtle) {
    status.textContent = 'Открой HTTPS-ссылку в Safari';
    return;
  }
  const passwordBytes = new TextEncoder().encode(field.value);
  field.type = 'password';
  field.value = '';
  toggle.setAttribute('aria-pressed', 'false');
  toggle.textContent = 'Показать';
  button.disabled = true;
  button.textContent = 'Открываю…';
  status.textContent = '';

  let html;
  let plaintext;
  try {
    const payload = JSON.parse(document.getElementById('payload').textContent);
    if (payload.version !== 1 || payload.iterations !== 600000) throw new Error('Invalid payload');
    const material = await crypto.subtle.importKey('raw', passwordBytes, 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:decode(payload.salt), iterations:payload.iterations, hash:'SHA-256'},
      material, {name:'AES-GCM', length:256}, false, ['decrypt']
    );
    plaintext = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:decode(payload.iv), tagLength:128}, key, decode(payload.data)
    );
    html = new TextDecoder('utf-8', {fatal:true}).decode(plaintext);
  } catch {
    status.textContent = 'Не удалось открыть панель. Проверь пароль';
    button.disabled = false;
    button.textContent = 'Открыть панель';
    field.focus();
    return;
  } finally {
    passwordBytes.fill(0);
    if (plaintext) new Uint8Array(plaintext).fill(0);
  }
  document.open();
  document.write(html);
  document.close();
});
})();
</script>
